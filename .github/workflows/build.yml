name: Build Small Tone VST3 (Windows + macOS)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dsp-test:
    name: Test du moteur chorus (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile + run
        run: |
          g++ -O2 -std=c++17 -I. dsp_test.cpp -o dsp_test
          ./dsp_test

  windows:
    name: VST3 Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SmallTone-VST3-Windows
          path: build/SmallTone_artefacts/Release/VST3/

  macos:
    name: VST3 macOS (universel)
    runs-on: macos-15-intel   # Mac Intel : file Apple Silicon saturée (binaire universel quand même)
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G Xcode
      - name: Build (arm64 + x86_64)
        run: cmake --build build --config Release --parallel -- -quiet
      - name: Ad-hoc sign + notice
        run: |
          cd "build/SmallTone_artefacts/Release/VST3"
          codesign --force --deep --sign - "Small Tone.vst3"
          lipo -info "Small Tone.vst3/Contents/MacOS/Small Tone"
          cat > "INSTALL macOS.txt" <<'TXT'
          1. Copy "Small Tone.vst3" to  ~/Library/Audio/Plug-Ins/VST3/   (or /Library/Audio/Plug-Ins/VST3/)
          2. Open Terminal and run once:
                xattr -cr ~/Library/Audio/Plug-Ins/VST3/"Small Tone.vst3"
             (removes the "downloaded from the internet" quarantine flag)
          3. Re-scan plug-ins in Reaper (Options > Preferences > Plug-ins > VST > Re-scan).
          TXT
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SmallTone-VST3-macOS
          path: |
            build/SmallTone_artefacts/Release/VST3/Small Tone.vst3
            build/SmallTone_artefacts/Release/VST3/INSTALL macOS.txt

  # Publie la version (tag v<VERSION de CMakeLists>) en Release GitHub, fichiers a nom fixe :
  # les boutons du README (.../releases/latest/download/SmallTone-VST3-<OS>.zip) suivent chaque version.
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [dsp-test, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(python3 -c "import re;print(re.search(r'^project\s*\(\s*\w+[^)]*?VERSION\s+([0-9.]+)',open('CMakeLists.txt').read(),re.M).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: SmallTone-VST3-Windows
          path: dist/win
      - uses: actions/download-artifact@v4
        with:
          name: SmallTone-VST3-macOS
          path: dist/mac
      - name: Archives
        run: |
          pack() {
            src="$1"; out="$GITHUB_WORKSPACE/$2"; wrap="$3"
            n=$(ls -A "$src" | wc -l); z=$(ls "$src"/*.zip 2>/dev/null | head -1)
            if [ "$n" = 1 ] && [ -n "$z" ]; then cp "$z" "$out"
            elif [ -n "$wrap" ]; then mkdir -p "pk/$wrap" && cp -a "$src"/. "pk/$wrap/" && (cd pk && zip -r -q -y "$out" "$wrap") && rm -rf pk
            else (cd "$src" && zip -r -q -y "$out" .); fi
          }
          pack dist/win "SmallTone-VST3-Windows.zip" ""
          pack dist/mac "SmallTone-VST3-macOS.zip" ""
          ls -l *.zip
      - name: Notice
        run: |
          # derniere notice du dossier docs/ (hors guide MIDI), publiee sous un nom fixe
          N=$(ls docs/*.pdf 2>/dev/null | grep -vi midi | sort -V | tail -1 || true)
          if [ -n "$N" ]; then cp "$N" SmallTone-Notice.pdf; echo "notice : $N"; else echo "pas de notice"; fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          FILES="SmallTone-VST3-Windows.zip SmallTone-VST3-macOS.zip"
          [ -f SmallTone-Notice.pdf ] && FILES="$FILES SmallTone-Notice.pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --latest --title "Small Tone $TAG" --notes "Installation : voir le README (Windows : C:\Program Files\Common Files\VST3 ; macOS : ~/Library/Audio/Plug-Ins/VST3)."
          fi
